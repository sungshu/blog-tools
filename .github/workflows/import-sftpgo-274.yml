name: Import SFTPGo 2.7.4 Traditional Chinese translation v2

on:
  push:
    paths:
      - '.github/workflows/import-sftpgo-274.yml'

permissions:
  contents: write

jobs:
  import-translation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract 2.7.4 translation
        shell: python
        run: |
          import html, json, re, urllib.request
          from pathlib import Path
          url = 'https://sungshu.pixnet.net/blog/posts/913347322592584128'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          with urllib.request.urlopen(req, timeout=30) as r:
              page = r.read().decode('utf-8', errors='replace')
          marker = '2.7.4 完整繁體中文 JSON 翻譯'
          pos = page.find(marker)
          if pos < 0: raise SystemExit('找不到 2.7.4 翻譯區段')
          text = html.unescape(re.sub(r'<[^>]+>', '', page[pos:])).strip()
          start = text.find('{')
          if start < 0: raise SystemExit('找不到 JSON 起點')
          data, _ = json.JSONDecoder().raw_decode(text[start:])
          out = json.dumps(data, ensure_ascii=False, indent=2) + '\n'
          target = Path('software/sftpgo/2.7.4')
          target.mkdir(parents=True, exist_ok=True)
          (target / 'translation.json').write_text(out, encoding='utf-8', newline='\n')
          (target / 'README.md').write_text('''# SFTPGo 2.7.4｜繁體中文化\n\n本目錄保存 Blog 文章後續補充的 **SFTPGo 2.7.4 Windows 版**完整繁體中文翻譯。\n\n- `translation.json`：文章「2.7.4 完整繁體中文 JSON 翻譯」內容。\n\n部署位置：`C:\\ProgramData\\SFTPGo\\static\\locales\\en\\translation.json`\n''', encoding='utf-8', newline='\n')
      - name: Commit files and remove temporary workflows
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add software/sftpgo/2.7.4/translation.json software/sftpgo/2.7.4/README.md
          git rm .github/workflows/import-sftpgo-274.yml .github/workflows/extract-sftpgo-274.yml
          git commit -m 'Add SFTPGo 2.7.4 Traditional Chinese translation'
          git push
